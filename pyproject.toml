[project]
name = "pytest-report-viewer"
version = "0.1.0"
description = "Pytest 수행 결과를 차수별로 웹에서 보여주는 프로그램"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "C90",      # mccabe 순환복잡도
    "D",        # docstring (Doxygen 주석 강제)
    "PL",       # pylint 규칙
]
ignore = [
    "D203",     # D211과 충돌
    "D213",     # D212와 충돌
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

# ---------------------------------------------------------------- Pytest / Coverage
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["src"]
